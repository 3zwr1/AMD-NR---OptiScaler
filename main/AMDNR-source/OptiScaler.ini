; -------------------------------------------------------
[Hotfix]
; -------------------------------------------------------
; Checks AMDNR's own GitHub releases (github.com/3zwr1/AMD-NR---OptiScaler) for a newer AMDNR
; version and shows a notice in the menu. It no longer checks upstream OptiScaler.
; true or false - Default (auto) is true
CheckForUpdate=auto

; Enables blocking of Steam and Epic overlays
; Also blocks Steam Input
; true or false - Default (auto) is false, except for OptiFG when true
DisableOverlays=auto

; Use manual input polling instead of hooking WndProc
; Might help games which does not capture inputs properly
; As a downside it will not be able to block inputs when menu is open
; true or false - Default (auto) is false
ManualInputPolling=auto

; Simulate waitable object event signals for FG swapchain
; true or false - Default (auto) is false
SimulateWaitableObject=auto

; OptiScaler will delay loading of Reshade and create D3D12 device first
; This option will prevent warnings/crashes with Luma and some other ReShade mods
; When using Luma mod and this will be enabled
; true or false - Default (auto) is false
CreateD3D12DeviceForLuma=auto

; OptiScaler will try to force High Performance GPU
; true or false - Default (auto) is false
PreferDedicatedGpu=auto

; OptiScaler will report only first High Performance GPU
; true or false - Default (auto) is false
PreferFirstDedicatedGpu=auto

; Rounds internal resolutions width and height to multiple of this value
; 2, 4, 8, 16 ...  - Default (auto) is disabled
RoundInternalResolution=auto

; Skips upscaling of n frames
; n is integer number  - Default (auto) is disabled
SkipFirstFrames=auto

; Restore last used compute signature after upscaling
; true or false - Default (auto) is false
RestoreComputeSignature=auto

; Restore last used graphics signature after upscaling
; true or false - Default (auto) is false
RestoreGraphicSignature=auto

; Tries to track signature changes to fully restore them
; Useful for games using bindless
; true or false - Default (auto) is false
ExtendedStateRestore=auto

; Use precompiled shaders for RCAS, Output Scaling and Mask Bias
; true or false - Default (auto) is true
UsePrecompiledShaders=auto

; Color texture resource state to fix for rainbow colors on AMD cards (for mostly UE games) 
; For UE engine games on AMD, set Color to 4 (D3D12_RESOURCE_STATE_RENDER_TARGET)
ColorResourceBarrier=auto
; For UE engine games on AMD, set MotionVector to 8 (D3D12_RESOURCE_STATE_UNORDERED_ACCESS)
MotionVectorResourceBarrier=auto
DepthResourceBarrier=auto
ColorMaskResourceBarrier=auto
ExposureResourceBarrier=auto
OutputResourceBarrier=auto

; Default (auto) is state correction disabled
; These settings defines each resources initial resource 
; state and add resource barrier for correct state
;
; Common resource barrier states
; ----------------------------------------------------
; D3D12_RESOURCE_STATE_COMMON = 0,
; D3D12_RESOURCE_STATE_VERTEX_AND_CONSTANT_BUFFER = 1,
; D3D12_RESOURCE_STATE_INDEX_BUFFER	= 2,
; D3D12_RESOURCE_STATE_RENDER_TARGET = 4,
; D3D12_RESOURCE_STATE_UNORDERED_ACCESS	= 8,
; D3D12_RESOURCE_STATE_DEPTH_WRITE = 16,
; D3D12_RESOURCE_STATE_DEPTH_READ = 32,
; D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE = 64,
; D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE = 128,
;------------------------------------------------------
; 
; All state values can be checked from here
; https://learn.microsoft.com/en-us/windows/win32/api/d3d12/ne-d3d12-d3d12_resource_states

[DlssNr]
; Neural runtime: daniel (danielblnc's closed 0.3.x runtime: dlssnr_amd_pass1..3.dll + weights) or
; lmxxf (the open-source HIP runtime: DLSS5-AMD\native-game-tiled-assets next to the game exe, or the
; dlss-5-amd-project 1.9.0 layout: native-game-tiled-assets + lmxxf-modules + shaders next to the exe).
; Unset: the menu opens on the first launch that finds a runtime installed and asks once.
; lmxxf needs LmxxfNrRuntime.dll beside OptiScaler.dll (shipped with this build) and the assets folder;
; its edit is applied one frame late, carried by the motion vectors. A change takes effect on the
; next game start. With a piece missing, danielblnc's runtime runs and the status line says which.
;NrBackend=daniel

; NR style slots (Neural tab > NR style > Custom style slots): the look controls captured as
; key=value;... strings by the Save button; written here by Save Settings. Empty = unused.
;StyleSlot1=
;StyleSlot2=
;StyleSlot3=

; Optional colour-based final-edit filter (not NVIDIA's semantic AutoMask).
; Warm scenery may match; coloured lighting may hide skin. Preview before relying on it.
; Controls apply once to the combined output of all model passes. 0..1 attenuates the edit.
SkinProtection=false
SkinToneEnabled=true
SkinDetail=1.0
SkinColour=1.0
EnvironmentDetail=1.0
EnvironmentColour=1.0
ShowSkinMask=false

; Toggle key: press it in-game, menu closed, to switch Neural Rendering on and off - both
; runtimes (danielblnc and lmxxf). A small notice says On / Off. Rebind it under Neural (the
; button beside Enable Neural Rendering) or Interface > Keybinds.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; Integer value - Default (auto) is HOME (0x24). Set a key code to change it, 0 to unbind.
ToggleKey=auto

; Capture key: press it in-game, no menu, and the AMD backend writes the next 8 frames
; (before and after its temporal pass) to a time-stamped amd-nr-capture folder next to the
; game. Press it while the problem is on screen, e.g. mid-turn for a ghost.
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; Integer value - Default (auto) is unbound. Set a key code (e.g. 0x78 = F9) to enable it.
CaptureKey=auto
; DLSS 5 Neural Rendering. Synthesises detail in the upscaler's output, before frame generation sees it.
; This switch turns it on for every path.
;
; AMD GPUs: runs the AMD runtime chosen under NrBackend above. lmxxf (LmxxfNrRuntime.dll + .pak)
; ships in this package; danielblnc's runtime comes separately (Runtime.zip).
; NVIDIA GPUs (the NVIDIA path this fork inherits): needs nvngx_dlssnr.dll 310.8 and the forwarder
; nvngx.dll_dlssnr.dll placed beside OptiScaler or the game executable. Neither file ships in this
; package, and neither does the install guide that lists their SHA-256. RTX 50 uses the original
; NVIDIA runtime; RTX 20/30/40 needs ShortFuse's cross-generation compatibility runtime from the
; pinned RenoDX thread. The snippet refuses callers whose module path does not contain "nvngx.dll",
; which is the only reason the forwarder exists.
;
; Undocumented and driven directly, so none of it is officially supported.
; true or false - Default (auto) is false
Enabled=auto

; NVIDIA path only. The AMD runtimes (lmxxf, danielblnc) do not read this key: they always run
; before Super Resolution, and after Ray Regeneration automatically when the game uses Ray
; Reconstruction. It matters on AMD only if the AMD runtime cannot run.
; Run Neural Rendering over the colour input immediately before Super Resolution, at render
; resolution. Ray Reconstruction remains on the supported post-upscale path. false keeps the NVIDIA
; path's post-upscale placement (as in v0.2.0). Origin-zero padded inputs use their active render size.
; Non-zero colour offsets or invalid active rectangles safely fall back post-upscale.
; true or false - Default (auto) is false
RunBeforeSR=auto

; NVIDIA path only (ApplyAfterRR, RRPasses, RRWorkingScale). On AMD the runtime processes Ray
; Reconstruction's output by itself whenever the game uses it; these keys are not read there.
; D3D12 and its bridges: opt in to NR after the game's native Ray Reconstruction.
; RR performs denoising/upscaling first. This never enables RR in unsupported games.
; Defaults: false, one pass, half of RR output width/height (1080p NR at 4K output).
; RRPasses is clamped to 1..3; RRWorkingScale to 0.25..2.0.
ApplyAfterRR=auto
RRPasses=auto
RRWorkingScale=auto

; Number of sequential model layers between one encode and one final composition. Each extra layer
; consumes the preceding model output and owns a separate persistent feature/history. 1 is normal;
; 2 and 3 are deliberately over-processed and cost almost exactly 2x and 3x the model time. The final
; answer is composed once against the immutable base proxy, so colour and transfer do not compound.
; Values are clamped to 1..3.
; danielblnc runs 1 pass on Vulkan titles (the Vulkan-on-D3D12 bridge); lmxxf runs all of them.
; Default (auto) is 1
Passes=auto

; How far the frame moves toward the model's picture. Its answer is not added to the frame: it is a
; complete picture, rescaled so its luminance sits where the original says it should, and this blends
; between the two. 0 gives back exactly what the upscaler produced, 1 is the model's picture, and above
; 1 carries on past it.
; Default (auto) is 1.0
TransferStrength=auto

; Whether the model's colour arrives with its light. 0 keeps the game's own hue exactly and lets only
; brightness carry the model's verdict; 1 brings the model's colour as well, in its own hue.
; Default (auto) is 1.0
ColourStrength=auto

; The linear value the encode maps to display white, which belongs to the game's exposure rather than to
; any fixed number: measured frame means in one game ranged from 0.065 to 185. Left automatic, it is
; measured from the frame. This does move the result, not only what the model is shown: the picture the
; model was given is one of the luminances the composition weighs. Applies only to a linear buffer; a
; frame the game reports as already tone-mapped is passed over untouched.
; true or false - Default (auto) is true
; Multiplies the white point above before the model sees the frame -- the paper-white control.
; Default (auto) is 1.0
WhitePointScale=auto

; The most the pass may brighten any pixel, as a multiple of what it already was. Darkening is not
; capped. Guards against the model turning a bright light into a string of coloured cells.
; Default (auto) is 2.0
MaxRatio=auto

; What fraction of the frame the model works at. The frame itself is never reduced -- only the model's
; own work is done small and enlarged. Cost falls with the square of this. Above 1.0 (DX12 & Vulkan)
; the model supersamples: it runs above native and the answer is averaged back down.
; Default (auto) is 1.0
WorkingScale=auto

; The downscaler that averages the model's answer back to native when WorkingScale is above 1.0
; (supersampling). Independent of OutputScaling/Downscaler, so the two can differ. 0 FSR1, 1 Bicubic,
; 2 CatmullRom, 3 Lanczos2, 4 Lanczos3, 5 Kaiser2, 6 Kaiser3, 7 MAGIC.
; Default (auto) is 4 (Lanczos3)
ScalingDownscaler=auto

; 0 off, 1 the picture the model sees, 2 its raw answer, 3 what it changed amplified twenty times.
; A flat grey difference view means the model is doing nothing.
; Default (auto) is 0
DebugView=auto

; Writes matched before/after frames to a dlssnr-capture folder beside OptiScaler when the pass first
; runs, and four more times over the next minute. Bounded to eight frames, and each run overwrites
; the last. A diagnostic: each run copies frames to readback memory and writes 60-130 MB to disk on
; the render thread, which is a visible stutter. Leave it off unless asked for a sample.
; true or false - Default (auto) is false
AutoCapture=auto

; Model controls. Preset and Style are baked into each feature, so changing them causes a guarded
; feature rebuild after the current GPU work retires. The values are undocumented, and the preset
; scale is not the same one Super Resolution or Ray Reconstruction uses.
; Default (auto) is 0
Preset=auto
Style=auto

; Passes 2 and 3 inherit the pass 1 Preset/Style above when left on auto. Set an override to use a
; different built-in model profile for that layer: preset 0..3; style 0 standard, 1 natural,
; 2 cinematic. These select profiles inside the same NVIDIA model DLL, not different model files.
Pass2Preset=auto
Pass2Style=auto
Pass3Preset=auto
Pass3Style=auto

; Per-pass model strengths (DX12 multipass, including NR after RR).
; Auto inherits pass 1, except LocalTone: auto keeps the legacy later-pass value 0.
; Intensity/LocalStructure/LocalTone: 0..2; SkinStructure: -1..2 (-1 follows structure).
Pass2Intensity=auto
Pass2LocalStructure=auto
Pass2LocalTone=auto
Pass2SkinStructure=auto
Pass2AutoMask=auto
Pass3Intensity=auto
Pass3LocalStructure=auto
Pass3LocalTone=auto
Pass3SkinStructure=auto
Pass3AutoMask=auto

; Default (auto) is 1.0
Intensity=auto
LocalStructure=auto
LocalTone=auto
; -1 means follow local structure, which is the model's own default, not a strength of zero.
; Default (auto) is -1.0
SkinStructure=auto
; true or false - Default (auto) is true
AutoMask=auto

; AMD pre-SR temporal stabilisation, 0..1. Steadies the denoised colour over time
; to reduce flicker/shimmer by blending in the previous frame, reprojected by the
; game's motion vectors and clamped to each pixel's local neighbourhood (so it
; cannot smear across edges). On by default and nudged up automatically on the
; frame after a denoise skip. Higher is steadier but softens motion slightly. 0
; turns it off. A camera cut or resolution change resets the history. Applies
; live; no model rebuild. AMD path only.
; With Model interleave on and AmdInterleavePreset 10 (Edit accumulation) it is how much of
; the model's previous answer is kept against a new one, on both runtimes (the correction is
; smoothed, never the picture).
; 0.0 to 1.0, or auto - Default (auto) is 0.6
AmdTemporalStability=auto

; Temporal stability mode. 0 = variance clamp (TAA-style; also fills interleave
; frames). 1 = difference-gated: blends toward the reprojected history ONLY where
; it already matches the frame (low shimmer); real motion/edges differ and pass
; through, so it has no ghosting by construction (after lmxxf native_output_smooth).
; 0 or 1 - Default (auto) is 0
AmdStabilityMode=auto
; Difference-gated sensitivity (tonemapped units, ~0.02-0.2). Pixels whose history
; differs by less than this are smoothed; larger differences pass through.
; Default (auto) is 0.04
AmdStabilityThreshold=auto

; Still-surface steadiness, 0..1 (0.3.3.2, both runtimes). Steadies shadows and flat areas that pulse
; while nothing moves: on pixels that provably did not move (motion, depth and the game's reactive mask
; agree) the temporal clamp is widened by a brightness-proportional amount; moving objects are
; unchanged. 0 = off (the old behaviour); try 0.5 if shadows flicker on still walls. Higher values can
; make lighting that changes on still walls lag slightly. Not used while Model interleave is on
; (Edit accumulation, the default) or with AmdTemporalStability=0. Live in Neural > Quality.
; 0.0 to 1.0 - Default (auto) is 0.0
AmdStabilityStaticRelax=auto

; AMD pre-SR Detail strength and Colour strength, 0..1. The model denoises the
; colour in place, so these blend the result back toward the pre-denoise image.
; Detail: how far brightness moves toward the model's answer (1 = full model).
; Colour: the model's own hue (1) vs the original hue at the model's brightness (0).
; Both 1.0 (default) is full strength and byte-identical (the mix pass is skipped).
; Default (auto) is 1.0
AmdDetailStrength=auto
AmdColourStrength=auto

; AMD pre-SR Contrast Adaptive Sharpening on the denoised colour, 0..1. 0 (default)
; is off. Restores crispness the denoise softens, before Super Resolution. Keep it
; light (0.3-0.6); too high over-sharpens once FSR upscales on top.
; Default (auto) is 0.0
AmdSharpness=auto

; danielblnc: away from 100% NR resolution, working sizes above about 1 MP are rounded to this many
; pixels (0.3.3.2). danielblnc's runtime keeps the buffers of every working size it has run at until the
; game restarts (about 75-350 MB of VRAM per pass), so dynamic resolution, DLSS modes and Dynamic NR
; reuse a few sizes instead of making a new one each time. 100% NR resolution is never changed; lmxxf
; is not affected. 0 = exact sizes (as before 0.3.3.2).
; 0 or 16 to 256 - Default (auto) is 64
AmdNrSizeStep=auto

; AMD pre-SR dynamic NR resolution. When true, the model's working scale is nudged
; in discrete, debounced steps (1.0/0.85/0.7/0.58/0.5) to hold AmdDynamicTargetFps.
; Each step rebuilds the model, so changes are deliberately infrequent: it steps down
; after about 1.5 s over the target and back up only after 5 s with room to spare, and
; after a step up that cannot hold it waits a minute. The manual NR resolution above
; acts as the ceiling. Off by default.
; true or false - Default (auto) is false
AmdDynamicRes=auto
; Target FPS for dynamic NR resolution, 30..240.
; Default (auto) is 60
AmdDynamicTargetFps=auto

; EXPERIMENTAL. AMD pre-SR model interleave: run the neural model on only part of
; the frames and fill the rest by temporal reprojection (forces the temporal
; stabiliser on). 0 = off (model every frame); above 1 is the average cadence and
; need not be a whole number - 2 = every 2nd frame (~half the model cost), 1.4 =
; skip roughly 2 frames in 5 (a gentler duty cycle, less flicker, smaller FPS
; gain). Big FPS win at any NR resolution, but can add motion ghosting and
; disturbs the model's temporal state - test per game. Default off.
; 0 or 1.01-4.0 - Default (auto) is 0
AmdInterleave=auto

; What an interleave FILL frame (a skipped model frame) shows.
; 0 = Projected Smart Fill History: the reprojected history, bounded by the colour
;     range that actually exists around the pixel in the current frame - and nothing
;     else mixed in. The bound breaks the ghost (a smeared taillight is red where the
;     road is grey, so it is pulled back); keeping every delivered pixel made only of
;     denoised history is what leaves nothing to see at the cadence. Recommended.
; 1 = reprojected history only: the last denoised frame moved by the motion vectors and
;     nothing else. A filled frame is built the same way as the frame before it, so it
;     cannot look different from it - no flicker by construction. Cost: ghosting where
;     a motion vector is wrong.
; 2 = smart fill: also blends in a blurred copy of the current UN-DENOISED frame where
;     it disagrees with the history, which breaks that ghost - but an un-denoised frame
;     does not look like a denoised one, so filled frames stop matching model frames and
;     the difference is visible as flicker at the interleave cadence.
; Only used when AmdInterleave is on. 0, 1 or 2 - Default (auto) is 0
AmdInterleaveFill=auto

; Interleave preset, only used when AmdInterleave is on.
; 1 = Standard: a skipped frame trusts the reprojected history where the motion field
;     is smooth and falls back to the current frame where it is not.
; 2 = Extra temporal: keeps taking the broad image from the denoised history even where
;     the motion is rough.
; 3 = Held frame: a skipped frame shows the previous model frame reprojected, whole,
;     with nothing gated. Ghosts on moving objects; cannot flicker on its own.
; 5 = Guided fill: the same picture as Held frame, under the name testers know it by.
; 6 = Guided fill v2: the same picture, but a skipped frame's fallbacks carry the model's
;     edit and the ghost bound compares raw against raw - removes the lamp/sign/sky pulse
;     at 2-3 passes and above ~115% NR (the model darkens highlights; the old bound
;     handed those pixels back to the raw frame on skipped frames only).
; 8 = Self-tuning (auto): grades every fill strategy against the model on each model
;     frame (per 16x16 tile) and blends them on skipped frames by those scores. Where the
;     picture stands still the reprojected picture wins; where something moves the fills
;     that cannot ghost win; it re-decides within a few model frames, per game, per scene.
; 10 = Edit accumulation, both runtimes: no picture is ever carried over. Every frame (model
;     and skipped alike) is THIS frame's raw plus the model's carried local correction - on
;     danielblnc a brightness/colour gain and a detail slope fitted to the model's answer, on
;     lmxxf the model's edit - checked raw against raw on every frame. Where the correction
;     does not fit, both frame types show the model's overall tone curve, so nothing pulses;
;     the model's answers are smoothed by AmdTemporalStability and each is spread over two
;     frames. Removes the held picture's one-frame ghost and 30 Hz grain; costs no more than 6.
;     On danielblnc the model frames show the fitted correction too (not the model's exact
;     picture), and where the correction does not fit the tone curve keeps this frame's detail
;     at the model's measured detail ratio. 6 shows the model's exact picture on model frames.
;     On lmxxf any other value is the classic carry.
; 1, 2, 3, 5, 6, 8 or 10 - Default (auto) is 10. (7 runs as 8; 9 and 11 run as 10.)
AmdInterleavePreset=auto

; Model history under interleave. false (default): every model frame is computed on its
; own, exactly as with interleave off. true: the network keeps its own temporal history
; across the skipped frame(s) - cleaner where nothing moves, but a ghost it builds there
; is in the model frames themselves and no fill preset can remove it (the ghost on a
; moving character). The menu's Live section shows a 'Model-frame ghost' meter.
; true or false - Default (auto) is false
AmdInterleaveModelHistory=auto

; lmxxf runtime only: the network's own temporal input - its previous answer, reprojected by
; this frame's motion vectors, fed back with the frame (DLSS 5's history path). true (default):
; the model accumulates over frames; false: every answer from scratch.
; true or false - Default (auto) is true
AmdLmxxfHistory=auto

; lmxxf runtime only: Full network (Neural tab > Performance). lmxxf skips 3 of the network's
; 71 blocks (42, 43 and 46) to save about 0.5 ms at 1080p; true runs all of them - slightly more
; faithful, about 0.5 ms slower (network time 16.6 -> 17.1 ms at 1920x1080 on an RX 9070 XT).
; Applies live: the network is rebuilt at the next model frame (about a second's hitch while its
; weights reload, as on an NR resolution change) and its history restarts; lmxxf_backend.log
; names the skipped blocks after every change. An LmxxfNrRuntime.dll older than this option
; refuses it: the default network runs and the menu says so. danielblnc's runtime is closed, so
; it does not apply there.
; true or false - Default (auto) is false
LmxxfFullNetwork=auto

; lmxxf runtime only, the edit shaper: controls on the model's edit before it is carried.
; EditDetail = gain on the fine part of the edit (1 = as the model made it, 0..2).
; EditSaturation = the edit's colour against its brightness change (0 = purely tonal, 0..2).
; EdgeGuard = fade the edit where the depth steps, so one surface's re-lighting cannot halo onto
; another (0 = off, 1 = none across a depth edge). OutputSmooth = upstream's output-side smoothing
; inside the runtime toward the motion-warped previous answer where they differ little (0 = off,
; at most 0.8 advised; needs AmdLmxxfHistory).
AmdLmxxfEditDetail=auto
AmdLmxxfEditSaturation=auto
AmdLmxxfEdgeGuard=auto
AmdLmxxfOutputSmooth=auto

; lmxxf only. When the game publishes no exposure texture, feed the network at an exposure that
; brings the encoded picture's mean toward 0.5 - what danielblnc's runtime does in every game -
; instead of the colour as is. The edit is divided back, so the game's own tone is untouched; only
; the model's operating point changes. Holds when the picture is already within a quarter of the
; target, corrects outside it; also takes over (the self-heal, logged) when the game's own
; exposure blacks out the feed, or blows it out (also when its value was refused and fed at 1).
; Its lowest exposure is 1/65536 (0.3.3; was 1/256), for linear HDR games without an exposure
; texture. Fed as is the model drifts in tone and colour (the "colour difference between the
; runtimes").
; false = the 0.3.0 behaviour.
; true or false - Default (auto) is true
AmdLmxxfAutoExposure=auto

; lmxxf only (0.3.3, on by default; tested in Silent Hill 2). Highlight colour
; guard. The network's codec squashes each colour channel above 0.75 (at the feed's exposure) on
; its own, so a bright pixel reaches the network close to white and comes back grey at the right
; brightness (colours that suddenly turn grey when the exposure steps up). On: where the fed
; pixel's brightest channel passes 0.75 (fully from 1.5), the model's answer keeps its brightness
; and takes the game's own colour; darker pixels are untouched. Classic and RenoDX composition;
; in RenoDX it acts on the answer before the composition (new in this build, not yet tested in a
; game), so Composition colour still applies. false = the answer's colour as is (the 0.3.2 picture).
; true or false - Default (auto) is true
AmdLmxxfHighlightChromaGuard=auto

; lmxxf only (0.3.3, on by default; tested in Silent Hill 2). Auto-exposure
; highlight cap. Auto-exposure also counts the samples it would feed past 0.75: above 8% of the
; picture it stops raising the exposure, above 25% it may lower it up to 4x per model frame
; instead of 1.5x. Dark, foggy scenes with bright lights are exposed a little less, so the
; lights keep their colour. Acts only while auto-exposure feeds the network. false = the mean
; alone steers it (the 0.3.2 behaviour).
; true or false - Default (auto) is true
AmdLmxxfAutoExposureHighlightCap=auto

; Held frame's ghost bound, 0..1. Replaces a reprojected pixel whose colour occurs nowhere
; in its current 3x3 neighbourhood (mean +/- k sigma) with the current frame. 0 = off.
; 1 = tightest (k = 3 sigma; never tighter, since a real one-pixel detail sits 2.83 sigma
; from its own neighbourhood). Default (auto) is 0.6 (k = 4.2 sigma).
; Only Held frame (3) reads this. Guided fill v2 (6) decides on its own, with a tolerance
; that follows the frame's noise; the slider is gone from the menu. That tolerance is the
; raw's grain in excess of the denoised history (texture no longer widens it), plus a floor
; that scales with the luminance (dark content is no longer blind), plus an allowance for
; the raw's own jitter on textured surfaces - measured on the Silent Hill 2 captures where
; the character held its previous pose on every skipped frame.
AmdInterleaveGhostBound=auto

; Adaptive interleave. The temporal pass measures how much of a skipped frame had to fall
; back and how much of the picture is moving; while either is high the model runs every
; frame, and interleave resumes once the picture settles. Interleave's ghosting and flicker
; only exist on skipped frames, and with this on a frame is only skipped while a skipped
; frame would look like a model frame (standing still: within 1/255). The frame-rate gain
; therefore comes and goes with the motion; the menu's Live line shows which state it is in.
; LOCKED OFF in this build: the key is read and ignored.
; true or false - Default (auto) is false
AmdInterleaveAdaptive=auto

; How much VISIBLE change it takes for the adaptive interleave to run the model on every
; frame. What is counted is a skipped-frame fallback that replaced something visibly
; different (a ghost or flicker the eye would have seen), and motion faster than six pixels
; a frame; ordinary motion that reprojects correctly does not count, that is what interleave
; is for. 0 = Low (most fps, artefacts tolerated longer), 1 = Medium, 2 = High (least fps).
; 0, 1 or 2 - Default (auto) is 1
AmdInterleaveAdaptiveSensitivity=auto

; Jitter compensation in the temporal pass. The game renders each frame on a grid shifted
; by its TAA jitter (up to 0.8 px between consecutive frames, measured), and a skipped
; frame's reprojected picture used to sit at the PREVIOUS frame's jitter: a sub-pixel wobble
; at half the frame rate, worst on edges and texture while moving. 1 = compensate (default),
; -1 = the opposite sign convention if a game reports its jitter the other way round
; (the picture would wobble twice as much with the wrong sign), 0 = off.
; -1, 0 or 1 - Default (auto) is 1
AmdJitterSign=auto

; Hybrid highlight proxy (experimental; danielblnc runtime only). What the model is shown.
; 0 = the frame as it is (default). 1 = above the knee the frame is compressed with a
; reversible curve (identity below it) before the model, and its answer is brought back with
; each pixel's ORIGINAL scale (RenoDX's principle): exact wherever the model changes nothing,
; its changes kept in proportion; where it removed a sparkle, its answer is kept. Above about
; 5x the knee a highlight's brightness follows the game's frame (the upscaler after this pass
; resolves its noise, as with the proxy off).
; Aimed at the model's highlight compression measured in Forza (bright content came back at
; about half its brightness): shown no extreme value, it cannot crush one, and detail inside
; lights, signs and sky survives. Two tiny in-place passes. Off until a capture confirms it.
; A safety net: the answer may not exceed 2x the brightest raw value in the pixel's 3x3
; neighbourhood (it only fires on model overshoot now).
; 0 or 1 - Default (auto) is 0
AmdHighlightProxy=auto

; The knee (linear, 1.0 = paper white) and the range above it the compressed highlights
; occupy (knee .. knee+range). Defaults 1.0 and 1.0.
AmdHighlightProxyKnee=auto
AmdHighlightProxyRange=auto

; With FSR Ray Regeneration (a game's DLSS Ray Reconstruction served on an AMD card) the
; neural pass runs AFTER it, on the finished output at display resolution, and writes its
; result back into that output. No setting: it happens whenever the RR feature is in use.
; It costs more per frame than the pre-SR placement because the model sees the display-
; sized frame; lower the NR resolution (menu, or AmdModelScale, e.g. 0.6) if the frame
; rate drops. Proof line in amd_presr.log: "Recorded post-RR".

; Network output (menu: Neural > Diagnostics). Shows the model's answer with everything of
; ours after it switched off: residual strength 1 and no limit, no temporal pass, no
; appearance filter, no highlight proxy, no sharpening. For seeing what the network itself
; does in a game where the effect is subtle; not for playing.
; true or false - Default (auto) is false
AmdNetworkOutput=auto

; Interleave pacing. Pads the cheap (filled) frame toward the model frame's cost so the
; frame time stops alternating long/short, which is what the engine's delta-time judder
; comes from. -1 = automatic: engages in proportion to the measured split (nothing under
; 15%, fully even from 30% up). 0 = off. 0..1 = a fixed strength (1 = fully even, the
; frame rate of interleave off). Not in the menu any more; the menu shows the measurement.
; Default (auto) is -1
AmdInterleavePacing=auto

; Final image mode: neural rendering on the finished frame for games with FSR 1 or no upscaler
; at all. Work in progress in the code, switched off in this release; this key has no effect yet.
AmdFinalImage=auto

; Vulkan titles only (Vulkan-on-D3D12 bridge), EXPERIMENTAL. With NR on, the bridge queues its wait
; for the game's texture copies right before its own D3D12 list runs, instead of before the
; upscaler and NR record. For danielblnc this is expected to remove the ~5 s pause on the first NR
; frame, the ~0.3 s hitch at each staging rebuild and the "inline flag check ... NOT seen" line.
; lmxxf is unchanged. Not yet tested in a game: testers, please send OptiScaler.log, amd_presr.log
; and dlssnr_on_amd.log. Proof line in OptiScaler.log: "AmdVkLateCopyWait is on".
; No effect on D3D12 or D3D11 games, or with NR off.
; true or false - Default (auto) is false
AmdVkLateCopyWait=auto

; A neural command list the game throws away (0.3.3.2). Both runtimes record their work into the game's
; command list and act when the game executes it. A list the game resets or releases without executing
; it used to leave danielblnc's runtime waiting for the rest of the session ("previous Record still awaits
; submission" in amd_presr.log), and could let lmxxf run on inputs that were never copied. On: AMDNR watches
; the one list NR last recorded into (a pointer compare per command-list Reset, nothing more), OptiScaler's
; own D3D11 / Vulkan bridges report a list they did not execute, and danielblnc completes the dropped job
; without it - NR pauses about 4 s and resumes with fresh history; lmxxf drops the job as a lost frame.
; Not yet tested in a game (nothing reproduces a discarded list on demand): the proof line in amd_presr.log
; is "the list this frame's neural work was recorded into ... its job is completed without it".
; false = no Reset hook, no bridge reports and no danielblnc recovery (danielblnc waits for the list, as
; before); lmxxf still restarts its history after a dropped list and matches by COM identity after two
; unexplained drops.
; true or false - Default (auto) is true
AmdNeuralListRecovery=auto

; NR runs only on the D3D12 device it started on (0.3.3.2). A frame recorded on another device (a second
; GPU, or a game that re-creates its device) goes to the upscaler untouched, with one line in
; amd_bridge.log, instead of reaching resources that belong to the first device. Not yet tested in a game
; (multi-GPU). false = no check, as before.
; true or false - Default (auto) is true
AmdDeviceGate=auto

; One neural stream per presented frame (0.3.3.2). When more than one NR entry per presented frame is
; measured (split view, a scope or picture-in-picture, a second upscaler context), NR runs on the largest
; and the others pass through untouched, so they no longer restart or mix its history. Games with one
; entry per frame are not affected. Proof line in amd_bridge.log: "NR entries per presented frame".
; Not yet tested in a game. false = every entry runs NR, as before.
; true or false - Default (auto) is true
AmdOneStreamPerFrame=auto

; Kill switches for 0.3.3.2 fixes, all on by default. They are read but never written by Save
; Settings; to use one, remove the ';' in front of it.
; AmdEditShaper=true           OPT-IN (off by default): danielblnc away from 100% NR, Residual strength /
;                              limit act on the model's edit instead of the whole result. Off by default
;                              because it washed highlights out in a test (Forza, Classic, 115% NR)
; AmdNrColourGuard=false       XeSS / FSR 2.2 / FSR 2.1.2 transition NR's output again (as before)
; AmdSkipUnwrittenFrames=false NR after Ray Regeneration also runs on frames the upscaler skipped
; lmxxf runtime switches are environment variables, not ini keys (set them before the game starts):
; AMDNR_C32W=0                 the old kernels instead of c32w (status line: c32w=off:env); the old
;                              LmxxfNrRuntime.pak does the same (c32w=off:nofile)
; DLSS5_IMPORT_POOL=0          HIP buffers made anew on every NR size change (the old behaviour)

; EXPERIMENTAL, and unavailable in this build: the runtime's 0.3.1 graphics wait (1-pixel
; draws) instead of the compute spin while the frame waits for its denoise. The wait may
; only run on a command list whose whole graphics state is known, and this build never
; learns one part of it (the graphics root signature), so it refused every list - while the
; hooks that watched them cost a lock on many of the game's command-list calls. They are no
; longer installed, and the compute wait runs whatever this says. It only changes what the
; runtime prepares when it starts: true, as in every earlier build, keeps that unchanged, and
; amd_presr.log then says "graphics wait unavailable in this build; compute wait used" once.
; danielblnc runtime 0.3.1 only; lmxxf has no graphics wait.
; true or false - Default (auto) is true
AmdGraphicsWaitExperimental=auto
