; -------------------------------------------------------
[FSR-RR]
; -------------------------------------------------------
; FSR Ray Regeneration tuning - the denoiser that serves a game's DLSS Ray Reconstruction on
; RDNA 4. UseAmdDefaults, DisocThreshold, PathTracedProfile, ProfileTextureRoute, BiasMaskStrength,
; DebugMode and the skin smoothing keys are live in the Neural tab (Quality > Ray Regeneration,
; shown while the game runs Ray Reconstruction).
;
; true: push the values AMD's denoiser reports as its own defaults (disocclusion 0.01, normal
;       strength 1.0, stability bias 1.0, max radiance 65504, radiance clip 50, kernel relaxation 0)
; false: the fork's tuned values below. An A/B for ghosting or flicker on skin and hair under RR.
; true or false - Default (auto) is false
FfxDenoiserUseAmdDefaults=auto

; Offer FSR Ray Regeneration on cards that are not RDNA 4 (RX 7000 and older). Off: RDNA 4 (RX 9000)
; only, so other cards keep the game's own denoiser. true = offer it anyway; if the driver refuses it,
; the Ray Reconstruction picture is upscaled WITHOUT a denoiser.
; true or false - Default (auto) is false
FfxDenoiserAllowPreRdna4=auto

; How far a pixel's depth / normal may drift from its history before that history is dropped.
; Smaller = stale history dropped sooner behind moving parts (less ghosting, a little more noise).
; AMD's default 0.01, the fork's 0.10. 0.005 to 0.2 - Default (auto) is 0.1
FfxDenoiserDisocThreshold=auto

; The rest of the fork's set (AMD's own default in brackets); all take a number or auto.
; FfxDenoiserCrossBlNormStr=auto   0.5   (AMD 1.0)
; FfxDenoiserStabilityBias=auto    0.5   (AMD 1.0)
; FfxDenoiserMaxRadiance=auto      40000 (AMD 65504)
; FfxDenoiserRadianceClip=auto     40    (AMD 50)
; FfxDenoiserGaussKernRelax=auto   0.5   (AMD 0)

; Path-traced profile - AMD's own setup for a fully path-traced game: all lit light goes into
; Ray Regeneration except pixels the game's bias mask flags, which still take the floor/skip
; path (FfxDenoiserBiasMaskStrength); none of the raw noisy colour is blended back after it;
; and the temporal settings move to AMD's documented defaults, except disocclusion 0.05 (the
; top of AMD's sample range; AMD's own default is 0.01); and the game's own sharpness is not
; applied to RR's output by FSR ([Sharpness] OverrideSharpness=true still applies yours; RCAS stays
; your switch). It changes these defaults:
;   FfxDenoiserFloorIsolation=0  FfxDenoiserFloorRawBlend=0  FfxDenoiserCorrelationBias=0
;   FfxDenoiserFloorHandover=0  FfxDenoiserStabilityBias=1.0  FfxDenoiserCrossBlNormStr=1.0
;   FfxDenoiserGaussKernRelax=0  FfxDenoiserRadianceClip=50  FfxDenoiserMaxRadiance=65504
;   FfxDenoiserDisocThreshold=0.05
; Any of those keys you set yourself still wins, also a value equal to the fork's default (Save
; Settings keeps it), and FfxDenoiserUseAmdDefaults=true still replaces the temporal ones.
; Opt-in since 0.3.3.1: Resident Evil Requiem and PRAGMATA no longer get it
; automatically (in RE Requiem it cleared grain on faces but corrupted the rest of the picture).
; true or false - Default (auto) is false
FfxDenoiserPathTracedProfile=auto

; Path-traced profile only: textured and very dark surfaces (brick, tiles, fabric, signs) go back
; to the fork's floor and raw blend (FloorIsolation / FloorRawBlend), while flat surfaces such as
; faces keep the profile's routing. The change is spread smoothly over a few pixels so that it
; does not draw an outline of its own. The profile's CorrelationBias 0 and FloorHandover 0 stay on
; every pixel. 1 is meant to remove the etched look the profile gave textures in Resident Evil
; Requiem (not yet confirmed in the game); 0 is the profile as in 0.3.3. Not used while the
; profile is off. Live in the overlay; the RR debug view ProfileTextureRoute shows where it acts.
; 0.0 to 1.0 - Default (auto) is 1.0
FfxDenoiserProfileTextureRoute=auto

; Bias mask routing. Pixels the game flags in its DLSS bias mask (particles, rain, animated
; textures - and in some games parts of faces) go around Ray Regeneration as raw colour.
; 1 = a flagged pixel bypasses RR completely; 0 = flagged pixels are denoised like the rest (less
; grain where the game flags faces; rain and particles may leave short trails). Live in the
; overlay (RR bias mask strength). A value you set is kept by Save Settings, also 1.
; 0.0 to 1.0 - Default (auto) is 1.0 (0 in Resident Evil Requiem; a value you set wins)
FfxDenoiserBiasMaskStrength=auto

; Debug view - replaces the picture with one of Ray Regeneration's internal images, to see where
; face grain comes from. The overlay's RR debug view picks one by name (the easy way); here it takes
; the view's number, decimal or 0x hex (64-bit):
;   0x4B0000     DenoiserFraction (red: through RR, blue: around it)
;   0x550000     ProfileTextureRoute (red: the path-traced profile's texture route)
;   0x450000     InBiasMask (what the bias mask sends around RR)
;   0x500000000  SkipSignal     0x700000000  DenoiserOutput     0x300000000  Correlation
; Default (auto) is 0 (off)
FfxDenoiserDebugMode=auto

; Skin smoothing (SSS guide) - AMDNR, experimental. For games that publish a screen-space
; subsurface scattering guide (Resident Evil Requiem does). After Ray Regeneration and only on the
; pixels the guide marks as skin, Ray Regeneration's diffuse lighting (the part the game's SSS blur
; touches) is smoothed by an edge-aware filter and only that change is added back, so pores,
; freckles and specular highlights stay sharp while the low-frequency blotches on faces under path
; tracing are evened out. Every pixel the guide does not mark, and every game without the guide, is
; left exactly as it was; while this and ShowMask are off nothing runs (the [RR_GUIDES] sss-range
; log line, too, is recorded only while one of them is on). All the skin keys are live in the overlay
; (Quality > Ray Regeneration). On by default in Resident Evil Requiem, where it greatly reduces
; flicker on faces (with radius 16 and guide thresholds 0.0265 / 0.0414 there, unless you set
; them); set false to turn it off there.
; true or false - Default (auto) is false (true in Resident Evil Requiem)
FfxDenoiserSkinSmoothing=auto

; How much of the smoothed lighting replaces Ray Regeneration's on fully marked skin; 0 is off.
; 0.0 to 1.0 - Default (auto) is 1.0
FfxDenoiserSkinSmoothingStrength=auto

; Reach of the filter in render pixels. Larger evens out bigger blotches but also softens the
; light and shadow shapes on the face. 1 to 16 - Default (auto) is 6 (16 in Resident Evil Requiem)
FfxDenoiserSkinSmoothingRadius=auto

; Replaces the picture with what the guide marks (coloured = skin, blue weak to red full; grey =
; left alone), to check that it really covers faces and does not flicker in motion.
; true or false - Default (auto) is false
FfxDenoiserSkinSmoothingShowMask=auto

; How the guide becomes the skin weight: |guide| / pixel brightness, from GuideLow the pixel starts
; to count as skin, from GuideHigh fully. The guide's units are not documented - the [RR_GUIDES]
; sss-range line in OptiScaler.log reports what the game publishes. Lower both if the mask misses
; faces, raise them if it covers cloth or other SSS materials. GuideHigh is kept above GuideLow.
; 0.0 to 10.0 - Default (auto) is 0.004 (GuideLow) and 0.04 (GuideHigh); 0.0265 and 0.0414 in
; Resident Evil Requiem
FfxDenoiserSkinSmoothingGuideLow=auto
FfxDenoiserSkinSmoothingGuideHigh=auto

; Skin classifier. 1 = Robust: a pixel counts as skin only where the guide marks it AND its diffuse
; albedo is skin-toned AND the game's SSS pass visibly moved most of the pixels around it; a pixel that
; was skin on the last frame keeps the mask while that evidence dips, so faces do not flicker. Resident
; Evil Requiem's guide also responds on walls, wet streets and coats, which the guide alone smoothed
; into blotches at night (25-39 % of a night street; Robust 0.5-2.3 % in the same scenes).
; 0 = the guide alone (0.3.3), for comparison. Live in the overlay (Skin classifier).
; 0 or 1 - Default (auto) is 1
FfxDenoiserSkinSmoothingClassifier=auto

; Robust classifier: the share of a pixel the game's SSS pass must have moved to start to count as
; skin (MovedLow) and to count fully (MovedHigh). Lower both if faces lose the mask; raise them if
; skin-toned walls, wood or leather keep it. The [RR_GUIDES] skin-classifier line in OptiScaler.log
; reports the values. MovedHigh is kept above MovedLow.
; 0.0 to 1.0 - Default (auto) is 0.05 (MovedLow) and 0.12 (MovedHigh)
FfxDenoiserSkinSmoothingMovedLow=auto
FfxDenoiserSkinSmoothingMovedHigh=auto

; With ShowMask on, draws the Robust classifier's three cues instead of the weight: red = the SSS
; pass moved most of the surface around the pixel, green = skin-toned albedo, blue = the pixel's own
; SSS evidence. Skin reads white to yellow.
; true or false - Default (auto) is false
FfxDenoiserSkinSmoothingShowCues=auto

[Spoofing]
; -------------------------------------------------------
; VendorID to spoof 
; 0x10de = Nvidia | 0x8086 = Intel | 0x1002 = AMD
; Integer value - Default (auto) is 0x10de 
SpoofedVendorId=auto

; DeviceID to spoof 
; 0x2684 = 4090 | 0xE20B = B580 | 0x7550 9070 XT
; Integer value - Default (auto) is 0x2684 (4090)
SpoofedDeviceId=auto

; Target VendorID to be spoofed
; Integer value - Default (auto) is all 
TargetVendorId=auto

; Target DeviceID to be spoofed
; Default (auto) is all 
TargetDeviceId=auto

; Spoofed GPU name
; NVIDIA GeForce RTX 4090 | Intel(R) Arc(TM) B580 Graphics | AMD Radeon RX 9070 XT
; Default (auto) is NVIDIA GeForce RTX 4090
SpoofedGPUName=auto

; Enables GPU spoofing for Streamline, even if Dxgi spoofing is disabled for the rest of the game
; Usually allows for using Fakenvapi without spoofing the whole game, and sometimes DLSS/DLSSG
; true or false - Default (auto) is true
StreamlineSpoofing=auto

; Enables Nvidia GPU spoofing for DXGI (can be changed above to spoof other vendors)
; true or false - Default (auto) is true for AMD/Intel, false for Nvidia
Dxgi=auto

; Enables wrapping of DxgiFactory instead of hooking
; Might cause issues or help Nvidia cards with other mods
; true or false - Default (auto) is false
DxgiFactoryWrapping=auto

; Skips DXGI GPU spoofing when caller method in the list (example: slInit|slGetPluginFunction|nvapi_QueryInterface)
; Be careful this will disable spoofing for rest of the calls, also does not work on Linux
; method names seperated with pipe "|" - Default (auto) is disabled
DxgiBlacklist=auto

; Spoof amount of VRAM for DXGI
; Spoofed amount in GBs - Default (auto) is disabled
DxgiVRAM=auto

; Enables Nvidia GPU spoofing for Vulkan (can be changed above to spoof other vendors)
; true or false - Default (auto) is false
Vulkan=auto

; Enables Nvidia extension spoofing for Vulkan
; true or false - Default (auto) is false
VulkanExtensionSpoofing=auto

; Spoof amount of VRAM for Vulkan
; Spoofed amount in GBs - Default (auto) is disabled
VulkanVRAM=auto

; Enables spoofing of Hardware Accelerated GPU Scheduling
; Required for Nukem's mod, also lets RTX40xx series users use DLSSG without HAGS enabled 
; true or false - Default (auto) is false, unless DLSSG mod is enabled
SpoofHAGS=auto

; Enables overriding of requested D3D feature level
; true or false - Default (auto) is false
D3DFeatureLevel=auto

; Prevents DirectX12 not supported error on UE games
; with Intel cards when spoofing enabled
; true or false - Default (auto) is false
UEIntelAtomics=auto

; Spoofs Vendor ID, Device ID and Driver Version at registry level
; true or false - Default (auto) is false
Registry=auto

; Driver version to be spoofed at registry
; string value - Default (auto) is 32.0.15.9155 (For Nvidia)
RegistryDriver=auto

; Spoofs Vendor ID, Device ID at User32 level
; true or false - Default (auto) is false
User32=auto



